services:
  - type: web
    name: brb-client
    runtime: static
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://brb-server.onrender.com/api/v1
      - key: EXPO_PUBLIC_USE_MOCK
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
